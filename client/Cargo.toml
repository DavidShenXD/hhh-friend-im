[package]
name = "friend-im-client"
version = "0.3.0"
edition = "2024"
publish = false
license = "MIT"
description = "Friend-IM 客户端库：连服务器、核对签名链、钥匙缓存、同步与断线重连。不认识 HHH 协议。"

[dependencies]
friend-im-core = { path = "../core" }
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "net"] }
socket2 = "0.6"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
zeroize = "1.9"

# 文件上传下载的 HTTP 客户端。原生构建用 reqwest。
[target.'cfg(not(target_os = "wasi"))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# WASI 构建（wasm32-wasip2，手机上由宿主解释执行）：reqwest 在 wasm32 上只有浏览器版本，改用 `web_wasi.rs` 里
# 同名接口的小实现——hyper（HTTP/1.1）跑在 tokio 网络上、rustls（ring）做 TLS，和 websocket 共用一个事件循环。
[target.'cfg(target_os = "wasi")'.dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
