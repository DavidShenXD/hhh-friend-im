[workspace]
# 根目录是插件程序；core 是两边共用的部分，client 是连服务器的客户端库。
members = ["core", "client"]
resolver = "3"

[package]
name = "friend-im"
version = "0.0.1"
edition = "2024"
publish = false
license = "MIT"
description = "Friend-IM：端到端加密的 HHH IM 插件"

[dependencies]
# 协议包：线上类型与 JSON-RPC 编解码（按标签取一个固定版本）。
hhh-im-protocol = { git = "https://github.com/MagicLizi/hhh-im-sdk", tag = "v0.1.0" }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
